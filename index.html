<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İK Yönetim Paneli</title>
<style>
:root{--bg:#f4f6fa;--fg:#1b2333;--card:#fff;--mut:#5b6678;--bd:#d9dfe9;--ac:#2457d6;--ok:#17794a;--wa:#a66300;--er:#c0262d;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141c;--fg:#e6eaf2;--card:#171e29;--mut:#9aa6ba;--bd:#2a3444;--ac:#6c9bff;--ok:#4cc38a;--wa:#e8b04b;--er:#ff7b80}}
:root[data-theme="dark"]{--bg:#0f141c;--fg:#e6eaf2;--card:#171e29;--mut:#9aa6ba;--bd:#2a3444;--ac:#6c9bff;--ok:#4cc38a;--wa:#e8b04b;--er:#ff7b80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:18px;margin:0}h2{margin:.2em 0}h3{margin:.6em 0 .3em}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap;border:0;background:none;color:var(--fg);padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit}
nav button[aria-current=page]{background:var(--ac);color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px}
button,input,select,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
button{cursor:pointer}button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.note{background:var(--card);border-left:4px solid var(--ac);padding:8px 12px;border-radius:6px;color:var(--mut)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.bar input[type=search]{flex:1;min-width:140px}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:560px}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{cursor:pointer;color:var(--mut);font-size:13px}td button{padding:3px 8px;margin-right:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}.card b{display:block;font-size:24px}
.ok{color:var(--ok)}.wa{color:var(--wa)}.er{color:var(--er)}.badge{font-weight:600}
.empty{padding:24px;text-align:center;color:var(--mut)}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);max-width:560px;width:94%}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.g label{display:flex;flex-direction:column;font-size:13px;gap:3px}
canvas{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px}
.pad{padding:0 10px 10px}
.lnk{border:0;background:none;color:var(--ac);padding:0;text-decoration:underline;cursor:pointer;font:inherit}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.av{overflow:hidden;width:52px;height:52px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.g2 .card{font-size:14px}
@media(max-width:420px){.g2{grid-template-columns:1fr}}
</style></head><body>
<header><h1>İK Yönetim Paneli</h1><button id="th" aria-label="Temayı değiştir">◐ Tema</button></header>
<nav id="nav" aria-label="Modüller"></nav><main id="main" tabindex="-1"></main>
<dialog id="dlg" aria-label="Form"></dialog><input type="file" id="file" accept=".csv,text/csv" hidden><input type="file" id="pfile" accept="image/*" hidden><input type="file" id="jfile" accept=".json,application/json" hidden>
<script>
'use strict';
/* ======== 1) SAF İŞ MANTIĞI (UI'dan bağımsız, test edilebilir) ======== */
// Resmi tatiller artık db.holidays içinde, "Resmi Tatiller" sekmesinden yönetilir (varsayılan: 2026 listesi)
const defaultHolidays=()=>[
 {id:uid(),tarih:'2026-01-01',ad:'Yılbaşı'},
 {id:uid(),tarih:'2026-03-20',ad:'Ramazan Bayramı 1. Gün'},
 {id:uid(),tarih:'2026-03-21',ad:'Ramazan Bayramı 2. Gün'},
 {id:uid(),tarih:'2026-03-22',ad:'Ramazan Bayramı 3. Gün'},
 {id:uid(),tarih:'2026-04-23',ad:'Ulusal Egemenlik ve Çocuk Bayramı'},
 {id:uid(),tarih:'2026-05-01',ad:'Emek ve Dayanışma Günü'},
 {id:uid(),tarih:'2026-05-19',ad:'Atatürk\'ü Anma, Gençlik ve Spor Bayramı'},
 {id:uid(),tarih:'2026-05-27',ad:'Kurban Bayramı 1. Gün'},
 {id:uid(),tarih:'2026-05-28',ad:'Kurban Bayramı 2. Gün'},
 {id:uid(),tarih:'2026-05-29',ad:'Kurban Bayramı 3. Gün'},
 {id:uid(),tarih:'2026-05-30',ad:'Kurban Bayramı 4. Gün'},
 {id:uid(),tarih:'2026-07-15',ad:'Demokrasi ve Millî Birlik Günü'},
 {id:uid(),tarih:'2026-08-30',ad:'Zafer Bayramı'},
 {id:uid(),tarih:'2026-10-29',ad:'Cumhuriyet Bayramı'}
];
const D=s=>new Date(s+'T00:00:00Z'), iso=d=>d.toISOString().slice(0,10);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmtD=s=>s?s.split('-').reverse().join('.'):'';
const fmtM=n=>n===''||n==null?'':Number(n).toLocaleString('tr-TR',{maximumFractionDigits:0})+' ₺';
// İş günü: hafta sonu ve resmi tatil hariç
function workDays(s,e){
 if(!s||!e||e<s)return 0;
 const HS=new Set(db.holidays.map(h=>h.tarih));
 let n=0;
 for(let d=D(s);d<=D(e);d.setUTCDate(d.getUTCDate()+1)){
  const w=d.getUTCDay();
  if(w&&w<6&&!HS.has(iso(d)))n++;
 }
 return n;
}
function tenMonths(s,now=today()){if(!s)return 0;const a=D(s),b=D(now);let m=(b.getUTCFullYear()-a.getUTCFullYear())*12+b.getUTCMonth()-a.getUTCMonth();if(b.getUTCDate()<a.getUTCDate())m--;return Math.max(m,0)}
const tenure=s=>s?Math.floor(tenMonths(s)/12)+' yıl '+tenMonths(s)%12+' ay':'';
// Yıllık izin hakkı (İş K. m.53): 1 yıldan az: yok; 1-5 yıl 14; 5-15 yıl 20; 15+ 26 gün
// 18 yaş ve altı ile 50 yaş ve üzeri için en az 20 gün. Yer altı işlerindeki +4 gün eklenmedi
const entitle=(s,dg)=>{const m=tenMonths(s);if(m<12)return 0;let h=m<=60?14:m<180?20:26;if(dg){const a=tenMonths(dg)/12;if(a<19||a>=50)h=Math.max(h,20)}return h};
// Kalan = hak − ONAYLI YILLIK izin. Ücretsiz/raporlu izin haktan düşmez (İş K. m.53-56 ayrımı)
const usedAnnual=(db,sc,yr)=>db.leave.filter(l=>l.emp===sc&&l.tur==='Yıllık'&&l.durum==='Onaylandı'&&l.bas.slice(0,4)==yr).reduce((t,l)=>t+workDays(l.bas,l.bit),0);
const hm=t=>{const[h,m]=t.split(':').map(Number);return h+m/60};
const otHours=(a,b)=>{if(!a||!b)return 0;let d=hm(b)-hm(a);return d<=0?d+24:d};
// Zam oranları: fazla çalışma %50 (İş K. m.41), hafta tatili çalışması %100 (m.46), genel tatil %100 (m.47)
// %25 yalnızca 'fazla sürelerle çalışma' içindir (haftalık 45 saat altı sözleşmesel süre), burada modellenmedi
const RATE={'Hafta içi':.5,'Hafta sonu':1,'Resmi tatil':1};
const otKind=s=>{
 const HS=new Set(db.holidays.map(h=>h.tarih));
 return HS.has(s)?'Resmi tatil':
  [0,6].includes(D(s).getUTCDay())?'Hafta sonu':'Hafta içi';
};
const weekKey=s=>{const d=D(s);d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return iso(d)};
const OTLIVE=db=>db.ot.filter(o=>o.durum!=='Reddedildi');
const otYear=(db,sc,yr)=>OTLIVE(db).filter(o=>o.emp===sc&&o.tarih.slice(0,4)==yr).reduce((t,o)=>t+otHours(o.bas,o.bit),0);
const otYearOk=(db,sc,yr)=>db.ot.filter(o=>o.emp===sc&&o.durum==='Onaylandı'&&o.tarih.slice(0,4)==yr).reduce((t,o)=>t+otHours(o.bas,o.bit),0);
const otWeek=(db,sc,wk)=>OTLIVE(db).filter(o=>o.emp===sc&&weekKey(o.tarih)===wk).reduce((t,o)=>t+otHours(o.bas,o.bit),0);
// Performans: 6 kriter, ağırlıklar İK felsefesini yansıtır
const W=[25,25,15,15,10,10];
const score=r=>W.reduce((t,w,i)=>t+(+r['c'+(i+1)]||0)*w,0)/100;
const label=s=>s>=4.5?'Mükemmel':s>=3.5?'Hedefin üzerinde':s>=2.5?'Hedefe uygun':s>=1.5?'Geliştirilmeli':'Yetersiz';
const bonusPct=(s,t)=>(t.find(x=>s>=x[0])||[0,0])[1];
const ST=['Başvuru','Görüşme','Teklif','İşe alındı','Reddedildi'];
// Eğitim geçerlilik: bitişe 60 gün kala sarı, dolunca kırmızı
function trainSt(r){if(!r.bitis)return['Süresiz',''];const d=(D(r.bitis)-D(today()))/864e5;return d<0?['Süresi doldu','er']:d<=60?['60 gün içinde bitiyor','wa']:['Geçerli','ok']}

/* ======== 2) VERİ KATMANI ======== */
const KEY='ik-panel-v1',uid=()=>Math.random().toString(36).slice(2,9);
const seed=()=>({p:{base:40,t:[[4.5,8],[4,5],[3,3]]},holidays:defaultHolidays(),
 emp:[['1001','Ayşe Yılmaz','İK','İK Uzmanı','','2021-03-01','1992-11-12','Belirsiz',60000],['1002','Mehmet Demir','Satış','Satış Temsilcisi','1001','2024-06-15','1989-12-01','Belirsiz',45000],['1003','Elif Kaya','Bilgi Teknolojileri','Yazılımcı','1001','2026-10-05','1995-05-20','Deneme',70000]].map(a=>({id:uid(),sicil:a[0],ad:a[1],dept:a[2],poz:a[3],yon:a[4],giris:a[5],dogum:a[6],tur:a[7],maas:a[8],durum:'Aktif',ayrilis:''})),
 leave:[{id:uid(),emp:'1002',tur:'Yıllık',bas:'2026-11-02',bit:'2026-11-06',acik:'',talep:'2026-10-20',durum:'Onaylandı'}],
 ot:[{id:uid(),emp:'1003',tarih:'2026-10-31',bas:'10:00',bit:'16:00',tur:'Hafta sonu',durum:'Beklemede'}],
 perf:[{id:uid(),emp:'1002',yil:2026,q:'3',c1:4,c2:4,c3:3,c4:5,c5:4,c6:4}],
 cand:[{id:uid(),ad:'Can Öz',poz:'İK Asistanı',tel:'0532 000 00 00',mail:'can@ornek.com',asama:'Görüşme',not:''}],
 train:[{id:uid(),emp:'1002',ad:'İş Sağlığı ve Güvenliği',veren:'OSGB',tarih:'2025-01-10',sure:8,bitis:'2026-12-15',durum:'Tamamlandı'}]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}db=db||seed();
if(!db.holidays)db.holidays=defaultHolidays();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};

/* ======== 3) ŞEMA (SH): tablo, form ve CSV tek yerden üretilir ======== */
// f: alanlar (k anahtar, l etiket, t tür, r zorunlu, u benzersiz, o seçenekler, e çalışan referansı, h tabloda gizle, d varsayılan)
// c: hesaplanan sütunlar [başlık, fn(r)=>[metin,sınıf]] · v: doğrulama · pf: filtre alanı · x: modül ek paneli
const E={k:'emp',l:'Çalışan',e:1,r:1},sd=sc=>(db.emp.find(e=>e.sicil===sc)||{}).maas||0;
const SH={
emp:{t:'Çalışanlar',e:'Henüz çalışan kaydı yok',pf:'durum',n:'Çalışan kaydı tek doğruluk kaynağıdır. Ayrılan çalışan silinmez, “Ayrıldı” yapılır: geçmiş izin, performans ve eğitim kayıtları bozulmaz. Sicil no değişirse bağlı tüm kayıtlar otomatik güncellenir.',
 f:[{k:'sicil',l:'Sicil No',r:1,u:1},{k:'ad',l:'Ad Soyad',r:1},{k:'dept',l:'Departman',r:1},{k:'poz',l:'Pozisyon'},{k:'yon',l:'Yönetici'},{k:'giris',l:'İşe Giriş',t:'date',r:1},{k:'dogum',l:'Doğum Tarihi',t:'date'},{k:'tur',l:'Sözleşme',o:['Belirsiz','Belirli','Deneme']},{k:'maas',l:'Aylık Brüt',t:'money'},{k:'durum',l:'Durum',o:['Aktif','Ayrıldı']},{k:'ayrilis',l:'Ayrılış',t:'date',h:1},
  // Özlük bilgileri (personel dosyası)
  {k:'tc',l:'TC Kimlik No',h:1},{k:'dogumYeri',l:'Doğum Yeri',h:1},{k:'medeni',l:'Medeni Durum',o:['','Bekar','Evli'],h:1},{k:'askerlik',l:'Askerlik Durumu',o:['','Yapıldı','Tecilli','Muaf','-'],h:1},{k:'kan',l:'Kan Grubu',h:1},{k:'banka',l:'Banka',h:1},{k:'iban',l:'IBAN',h:1},{k:'acilKisi',l:'Acil Durum Kişisi',h:1},{k:'acilTel',l:'Acil Durum Tel',t:'tel',h:1}],
 c:[['Kıdem',r=>[tenure(r.giris)]]],v:r=>r.durum==='Ayrıldı'&&!r.ayrilis?'Ayrıldı durumunda ayrılış tarihi zorunludur.':''},
leave:{t:'İzin Yönetimi',e:'Henüz izin talebi yok',pf:'durum',n:'Yıllık izin hak edişe göre kullanılır ve bakiyeden düşer; ücretsiz ve raporlu izin haktan düşmez. Süre iş günü olarak hesaplanır (hafta sonu ve resmi tatil hariç).',
 f:[E,{k:'tur',l:'Tür',o:['Yıllık','Mazeret','Ücretsiz','Raporlu','Doğum','Evlilik']},{k:'bas',l:'Başlangıç',t:'date',r:1},{k:'bit',l:'Bitiş',t:'date',r:1},{k:'acik',l:'Açıklama',h:1},{k:'talep',l:'Talep Tarihi',t:'date',d:today},{k:'durum',l:'Durum',o:['Beklemede','Onaylandı','Reddedildi']}],
 c:[['İş günü',r=>[workDays(r.bas,r.bit)]]],v:r=>r.bit<r.bas?'Bitiş tarihi başlangıç tarihinden önce olamaz.':'',
 x:()=>'<h3>İzin bakiyesi (yıllık)</h3>'+tbl(['Çalışan','Hak','Kullanılan','Kalan'],db.emp.filter(e=>e.durum==='Aktif').map(e=>{const h=entitle(e.giris,e.dogum),u=usedAnnual(db,e.sicil,today().slice(0,4));return[e.ad,h,u,[h-u,h-u<0?'er':'']]}))},
ot:{t:'Fazla Mesai',e:'Henüz mesai talebi yok',pf:'durum',n:'Zamlı saat = süre × (1 + zam oranı). Yıllık 270 saat tavanı ve haftalık 45 saat sınırı otomatik izlenir.',
 f:[E,{k:'tarih',l:'Tarih',t:'date',r:1},{k:'bas',l:'Başlangıç',t:'time',r:1},{k:'bit',l:'Bitiş',t:'time',r:1},{k:'tur',l:'Tür',o:Object.keys(RATE)},{k:'durum',l:'Durum',o:['Beklemede','Onaylandı','Reddedildi']}],
 c:[['Normal saat',r=>[otHours(r.bas,r.bit).toFixed(1)]],['Zamlı saat',r=>[(otHours(r.bas,r.bit)*(1+RATE[r.tur])).toFixed(1)]],['Uyarı',r=>otYearOk(db,r.emp,r.tarih.slice(0,4))>270?['270 sa tavanı aşıldı','er']:otYear(db,r.emp,r.tarih.slice(0,4))>270?['Bekleyenlerle 270 sa aşılır','wa']:db.p.base+otWeek(db,r.emp,weekKey(r.tarih))>45?['Haftalık 45 sa aşıldı','wa']:['','']]],
 v:r=>r.bas===r.bit?'Başlangıç ve bitiş saati aynı olamaz.':r.tarih&&otKind(r.tarih)!==r.tur?'Tür tarihle uyuşmuyor, beklenen: '+otKind(r.tarih)+'.':'',
 x:()=>{const y=today().slice(0,4);return'<h3>Yıllık fazla mesai toplamı</h3>'+tbl(['Çalışan','Onaylı','Bekleyen','Durum'],db.emp.map(e=>{const a=otYearOk(db,e.sicil,y),t=otYear(db,e.sicil,y);return[e.ad,a.toFixed(1),(t-a).toFixed(1),a>270?['Tavan aşıldı','er']:t>270?['Bekleyenle aşılır','wa']:t>216?['Tavana yakın','wa']:['Normal','ok']]}))}},
perf:{t:'Performans ve Prim',e:'Henüz değerlendirme yok',pf:'q',n:'Çeyreklik değerlendirme; 6 kriter ağırlıklı ortalama ile puanlanır. Prim = aylık brüt × eşiğe göre prim yüzdesi. Ağırlıklar: kalite %25, hedef %25, verimlilik %15, takım %15, sorumluluk %10, gelişim %10.',
 f:[E,{k:'yil',l:'Yıl',t:'number',r:1,d:()=>new Date().getFullYear()},{k:'q',l:'Çeyrek',o:['1','2','3','4']},...['İş kalitesi','Hedef gerçekleştirme','Verimlilik ve zaman','Takım çalışması','Sorumluluk ve inisiyatif','Gelişim ve öğrenme'].map((l,i)=>({k:'c'+(i+1),l:l+' (%'+W[i]+') 1-5',t:'n',r:1,h:1}))],
 c:[['Puan',r=>[score(r).toFixed(2)]],['Sonuç',r=>[label(score(r))]],['Prim %',r=>['%'+bonusPct(score(r),db.p.t)]],['Prim ₺',r=>[fmtM(sd(r.emp)*bonusPct(score(r),db.p.t)/100)]]],
 x:()=>{const g={};db.perf.forEach(r=>{const k=r.emp+'|'+r.yil,o=g[k]=g[k]||{emp:r.emp,yil:r.yil,s:[],p:0};o.s.push(score(r));o.p+=sd(r.emp)*bonusPct(score(r),db.p.t)/100});
  return`<h3>Prim parametreleri</h3><div class="bar">${db.p.t.map((x,i)=>`<label>${x[0]}+ puan %<input type="number" data-p="${i}" value="${x[1]}" min="0" style="width:70px"></label>`).join('')}<label>Haftalık normal saat <input type="number" data-p="base" value="${db.p.base}" style="width:70px"></label></div><h3>Yıllık özet</h3>`+
  tbl(['Çalışan','Yıl','Çeyrek','Ort. puan','Toplam prim'],Object.values(g).map(o=>[(db.emp.find(e=>e.sicil===o.emp)||{ad:o.emp}).ad,o.yil,o.s.length,(o.s.reduce((a,b)=>a+b,0)/o.s.length).toFixed(2),fmtM(o.p)]))}},
cand:{t:'İşe Alım',e:'Henüz aday yok',pf:'asama',n:'Pipeline: Başvuru → Görüşme → Teklif → İşe alındı. Dönüşüm oranları süreç darboğazını gösterir. İşe alınan aday tek tıkla çalışan kaydına aktarılır.',
 f:[{k:'ad',l:'Ad Soyad',r:1},{k:'poz',l:'Pozisyon',r:1},{k:'tel',l:'Telefon',t:'tel'},{k:'mail',l:'E-posta',t:'email'},{k:'asama',l:'Aşama',o:ST},{k:'not',l:'Notlar',t:'area',h:1}],
 x:()=>{const a=db.cand.filter(c=>c.asama!=='Reddedildi'),n=i=>a.filter(c=>ST.indexOf(c.asama)>=i).length,p=(x,y)=>x?Math.round(y/x*100)+'%':'-';
  return'<h3>Dönüşüm oranları</h3>'+tbl(['Geçiş','Oran'],[['Başvuru → Görüşme',p(n(0),n(1))],['Görüşme → Teklif',p(n(1),n(2))],['Teklif → İşe alındı',p(n(2),n(3))]])}},
train:{t:'Eğitim Takibi',e:'Henüz eğitim kaydı yok',pf:'durum',n:'Zorunlu eğitimlerin (İSG, sertifikalar) geçerlilik takibi. Bitişe 60 gün kala sarı, süresi dolunca kırmızı uyarı.',
 f:[E,{k:'ad',l:'Eğitim Adı',r:1},{k:'veren',l:'Veren Kurum'},{k:'tarih',l:'Tarih',t:'date'},{k:'sure',l:'Süre (saat)',t:'number'},{k:'bitis',l:'Geçerlilik Bitişi',t:'date'},{k:'durum',l:'Durum',o:['Planlandı','Tamamlandı']}],
 c:[['Geçerlilik',trainSt]]},
hol:{t:'Resmi Tatiller',src:'holidays',e:'Henüz tatil eklenmedi',
 n:'Bu liste izin iş günü hesabında ve fazla mesai türü tespitinde kullanılır. Her yıl güncellenmelidir. Arife yarım günleri ve idari tatiller elle eklenebilir.',
 f:[{k:'tarih',l:'Tarih',t:'date',r:1,u:1},{k:'ad',l:'Ad',r:1}],
 c:[['Gün',r=>{const g=D(r.tarih).getUTCDay();
  return[['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'][g]]}]]}};

const README=`<h2>README</h2><h3>Modellenen süreçler</h3><p>Çalışan yaşam döngüsü (kayıt, kıdem, ayrılış), izin ve bakiye, fazla mesai ve yasal sınırlar, çeyreklik performans ve prim, işe alım pipeline, eğitim geçerliliği, dashboard, CSV içe/dışa aktarma. İş mantığı “SAF İŞ MANTIĞI” bölümündeki fonksiyonlarda, tablolar tek <code>SH</code> şemasındadır.</p><h3>Varsayımlar</h3><p>Yıllık izin hakkı m.53 kademelerine göre kıdemden hesaplanır; 18 yaş ve altı ile 50 yaş ve üzeri için en az 20 gün uygulanır. Yer altı işlerindeki +4 gün eklenmedi. Zam oranları: hafta içi fazla çalışma %50 (m.41), hafta tatili çalışması %100 (m.46), genel tatil %100 (m.47). %25’lik “fazla sürelerle çalışma” modellenmedi. 5 günlük haftada cumartesi hafta tatili sayılmaz, hukuken fazla çalışma (%50) olabilir; tür seçimi bunu ayırt etmez. Haftalık 45 saat kontrolü için normal haftalık süre 40 saat varsayıldı (Performans sayfasından değişir). Yıllık 270 saat tavanı satır uyarısı yalnızca onaylı mesaiyle kırmızı, bekleyenlerle birlikte aşılırsa sarı verir. Resmi tatiller “Resmi Tatiller” sekmesinden yönetilir; 2026 listesi varsayılan olarak yüklenir. Arife yarım günleri ve idari tatiller elle eklenebilir. Madde numaralarını yayımlamadan önce teyit edin.</p><h3>Bilinen eksikler</h3><p>Kimlik doğrulama ve rol yetkisi yok. Veri yalnızca tarayıcıda (localStorage). Reddedilen adayın hangi aşamada elendiği tutulmuyor, dönüşüm oranı bu yüzden yaklaşık. Haftalık 45 saat kontrolünde izinli günler hesaba katılmıyor. Yarım gün izin, devir eden izin bakiyesi, bordro ve vergi hesabı yok. Otomatik test yok, fonksiyonlar test edilebilir yazıldı. İçe aktarma tek çalışan tablosu için.</p>`;

 rd.onerror=bad;im.onerror=bad;rd.onload=()=>{im.src=rd.result};
 im.onload=()=>{const c=document.createElement('canvas'),n=240,m=Math.min(im.width,im.height);c.width=c.height=n;
  c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,n,n);
  const x=db.emp.find(z=>z.sicil===fotoSc);if(!x)return;x.foto=c.toDataURL('image/jpeg',.8);save();empProfile(fotoSc)};
 rd.readAsDataURL(f)});
/* Olaylar */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const{a,m,i}=b.dataset,row=k=>db[k].find(x=>x.id===i);
 if(a==='tab'){tab=b.dataset.t;view={q:'',f:'',s:'',d:1};sayfa=1;render()}
 else if(a==='add')form(m);else if(a==='edit')form(m,row(SH[m].src||m));else if(a==='close')$('#dlg').close();
 else if(a==='del')ask('Bu kayıt silinsin mi?',()=>{db[SH[m].src||m]=db[SH[m].src||m].filter(x=>x.id!==i);save();render()});
 else if(a==='ok'||a==='no'){const r=row(m);if(m==='cand')r.asama='Reddedildi';else r.durum=a==='ok'?'Onaylandı':'Reddedildi';save();render()}
 else if(a==='left'){const r=row('emp');r.durum='Ayrıldı';r.ayrilis=today();save();render()}
 else if(a==='mv'){const r=row('cand'),x=ST.indexOf(r.asama);r.asama=x===4?ST[0]:ST[Math.min(3,Math.max(0,x+ +b.dataset.d))];save();render()}
 else if(a==='xfer'){const r=row('cand');form('emp',null,{ad:r.ad,poz:r.poz,giris:today(),durum:'Aktif',tur:'Deneme'})}
 else if(a==='holreset')ask('Resmi tatil listesi varsayılana (2026) sıfırlansın mı? Elle yaptığınız değişiklikler silinir.',()=>{db.holidays=defaultHolidays();save();render()});
 else if(a==='pg'){sayfa+=+b.dataset.d;fill(tab)}
 else if(a==='bk'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));l.download='ik-yedek-'+today()+'.json';l.click()}
 else if(a==='rs')$('#jfile').click();
 else if(a==='view')empProfile(row('emp').sicil);
 else if(a==='foto'){fotoSc=b.dataset.s;$('#pfile').click()}
 else if(a==='fotoDel'){const x=db.emp.find(z=>z.sicil===b.dataset.s);if(x){delete x.foto;save();empProfile(x.sicil)}}
 else if(a==='exp')exportCSV(m);else if(a==='imp')$('#file').click();
 else if(a==='sort'){const k=b.dataset.k;view.d=view.s===k?-view.d:1;view.s=k;fill(tab)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('th[data-a]'))e.target.click()});
document.addEventListener('input',e=>{if(e.target.id==='q'){view.q=e.target.value;sayfa=1;fill(tab)}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='ff'){view.f=t.value;sayfa=1;fill(tab)}
 if(t.dataset.p!==undefined){if(t.dataset.p==='base')db.p.base=+t.value;else db.p.t[+t.dataset.p][1]=+t.value;save();render()}});
$('#th').addEventListener('click',()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark';try{localStorage.setItem('ik-theme',r.dataset.theme)}catch(e){}if(tab==='dash')chart()});
try{const t=localStorage.getItem('ik-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
addEventListener('resize',()=>tab==='dash'&&chart());
render();
</script></body></html>
